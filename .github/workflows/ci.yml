name: Public source and synthetic demo
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_public_release.py
      - run: python -m pytest -q
      - run: python scripts/demo/run_demo.py --with-imputation
